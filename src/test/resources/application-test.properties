spring.application.name=sisges-test

security.jwt.secret-key=test-secret-key-minimum-32-characters-long
security.jwt.expiration-time=3600000

sisges.upload.dir=${java.io.tmpdir}/sisges-test-uploads
sisges.minio.endpoint=http://localhost:9000
sisges.minio.access-key=minioadmin
sisges.minio.secret-key=minioadmin
sisges.minio.bucket=sisges-test
sisges.seed.enabled=false
sisges.local-admin.enabled=false

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.default-schema=sisges
spring.flyway.locations=classpath:db/migration

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
