name: Backend Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Publicar imagem de produção
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sisges_test
          POSTGRES_USER: sisges
          POSTGRES_PASSWORD: sisges
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sisges -d sisges_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SISGES_TEST_DATABASE_URL: postgresql://sisges:sisges@127.0.0.1:5432/sisges_test
      SISGES_TEST_CYCLE_DATABASE_URL: postgresql://sisges:sisges@127.0.0.1:5432/sisges_cycle_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true

      - name: Verify backend
        run: |
          psql "$SISGES_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE sisges_cycle_test'
          go test -race ./...
          go vet ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sisges-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/sisges-backend:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
