# CI/CD: build backend image, push to Docker Hub, deploy to EC2 on push to main.
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME  - Docker Hub username (e.g. hugodfreitas)
#   DOCKERHUB_TOKEN     - Docker Hub access token (not your password)
#   EC2_HOST            - EC2 public IP or hostname
#   EC2_USER            - SSH user (e.g. ubuntu or ec2-user)
#   EC2_SSH_KEY         - Full contents of your .pem private key
#
# EC2 prerequisites: Docker, docker compose, ~/sisges-deploy with
# docker-compose.hub.yml and .env.prod.

name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sisges_test
          POSTGRES_USER: sisges
          POSTGRES_PASSWORD: sisges
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sisges -d sisges_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SISGES_TEST_DATABASE_URL: postgresql://sisges:sisges@127.0.0.1:5432/sisges_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true

      - name: Verify backend
        run: |
          go test -race ./...
          go vet ./...

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/sisges-backend:latest

      - name: Deploy backend to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            export DOCKERHUB_USER=${{ secrets.DOCKERHUB_USERNAME }}
            cd ~/sisges-deploy
            docker compose -f docker-compose.hub.yml --env-file .env.prod pull backend
            docker compose -f docker-compose.hub.yml --env-file .env.prod up -d backend
