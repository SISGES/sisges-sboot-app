services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sisges
    volumes:
      - sisges-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sisges"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/sisges?sslmode=disable
      SECURITY_JWT_SECRET_KEY: docker-compose-dev-secret-min-32-chars-xx
      SISGES_CORS_ALLOWED_ORIGIN_PATTERNS: http://localhost:3001,http://127.0.0.1:3001
      SISGES_R2_ENDPOINT: ${SISGES_R2_ENDPOINT:-}
      SISGES_R2_ACCESS_KEY_ID: ${SISGES_R2_ACCESS_KEY_ID:-}
      SISGES_R2_SECRET_ACCESS_KEY: ${SISGES_R2_SECRET_ACCESS_KEY:-}
      SISGES_R2_BUCKET: ${SISGES_R2_BUCKET:-sisges-prd}
      SISGES_R2_REGION: ${SISGES_R2_REGION:-auto}
      SISGES_SEED_ENABLED: "true"
      SISGES_DB_MAX_CONNECTIONS: "6"
      GOMEMLIMIT_BYTES: "167772160"
      GOGC_PERCENT: "75"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080/api
    depends_on:
      - backend
    ports:
      - "3001:80"

volumes:
  sisges-pgdata:
