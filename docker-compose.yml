services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sisges
    volumes:
      - sisges-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sisges"]
      interval: 5s
      timeout: 5s
      retries: 10

  sisges-minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - sisges-minio-data:/data

  sisges-minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      - sisges-minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://sisges-minio:9000 minioadmin minioadmin; do sleep 2; done &&
      mc mb --ignore-existing local/sisges-uploads &&
      mc anonymous set none local/sisges-uploads
      "

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      sisges-minio:
        condition: service_started
      sisges-minio-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/sisges
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SECURITY_JWT_SECRET_KEY: docker-compose-dev-secret-min-32-chars-xx
      SISGES_CORS_ALLOWED_ORIGIN_PATTERNS: http://localhost:3001,http://127.0.0.1:3001
      SISGES_MINIO_ENDPOINT: http://sisges-minio:9000
      SISGES_MINIO_ACCESS_KEY: minioadmin
      SISGES_MINIO_SECRET_KEY: minioadmin
      SISGES_MINIO_BUCKET: sisges-uploads
      SISGES_SEED_ENABLED: "true"

  frontend:
    build:
      context: ../sisges-react-app
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080/api
    depends_on:
      - backend
    ports:
      - "3001:80"

volumes:
  sisges-pgdata:
  sisges-minio-data:
